version: "2"

# sqlc drives the Postgres access layer (ARCHITECTURE.md section 3). The schema
# is the goose migration set; generated code lands in internal/store/postgres
# and is never hand-edited.
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "queries"
        out: "internal/store/postgres/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "numeric"
            go_type: "float64"