version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
